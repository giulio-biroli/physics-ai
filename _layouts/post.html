---
layout: default
---
{%- assign minutes = content | number_of_words | divided_by: 220 | at_least: 1 -%}
<div class="container">
  <header class="post-head">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="{{ '/blog/' | relative_url }}">Blog</a></nav>
    <p class="post-date">{{ page.date | date: "%-d %B %Y" }} · {{ page.author }} · {{ minutes }} min read</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    <div class="prose">{{ content }}</div>
    <footer class="post-foot"><a class="link-back" href="{{ '/blog/' | relative_url }}">All posts</a></footer>
  </div>
</div>
