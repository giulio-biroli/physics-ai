{%- comment -%} "Add to calendar" for one session: site.js turns it into a downloaded .ics file; without JavaScript it falls back to the full seminar calendar. {%- endcomment -%}
{%- assign e = include.event -%}
{%- assign e_end = e.end | default: e.date -%}
<a class="{{ include.class }}" href="{{ '/calendar.ics' | relative_url }}" data-ics
   data-ics-uid="{{ e.slug }}@physics-in-the-age-of-ai"
   data-ics-file="{{ e.slug }}.ics"
   data-ics-start="{{ e.date | date: '%Y%m%dT%H%M%S' }}"
   data-ics-end="{{ e_end | date: '%Y%m%dT%H%M%S' }}"
   data-ics-title="{% if e.calendar_title %}{{ e.calendar_title }}{% else %}{{ site.title }}: {{ e.title }}{% endif %}"
   data-ics-speaker="{{ e.speaker }}"
   data-ics-location="Room {{ e.room }}, {{ site.venue.name }}, {{ site.venue.address }}"
   data-ics-url="{{ e.url | absolute_url }}">{{ include.label }}</a>
